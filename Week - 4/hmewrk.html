<!DOCTYPE html>
<html>

<head>
  <title>My Favorite Foods</title>

  <style>
    /* Page Background */
    body {
      background-color: teal;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Main Title */
    h1 {
      text-align: center;
      color: black;
    }

    /* All paragraphs */
    p {
      color: #003049;
      line-height: 1.6;
    }

    /* Highlight class */
    .highlight {
      background-color: #fcbf49;
      padding: 10px;
      border-radius: 5px;
    }

    /* Flexbox container */
    .image-row {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 20px;
    }

    /* Food card styling */
    .food-card {
      background-color: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      flex: 1;
    }

    /* Images */
    .food-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>My Favorite Foods</h1>

  <p class="highlight">
    These are some of my favorite foods.
  </p>

  <section class="image-row">

    <div class="food-card">
      <img src="https://www.pccmarkets.com/wp-content/uploads/2017/08/pcc-rosemary-grilled-salmon-flo.jpg">
      <p>Salmon</p>
    </div>

    <div class="food-card">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPgdpaSeybHBRBSbIxnR0d5wHCyNCsP0GplA&s">
      <p>Steak</p>
    </div>

    <div class="food-card">
      <img src="https://tastesbetterfromscratch.com/wp-content/uploads/2014/09/Baked-Chicken-Wings-3.jpg">
      <p>Chicken Wings</p>
    </div>

  </section>

</body>

</html>
