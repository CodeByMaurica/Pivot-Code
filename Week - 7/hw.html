<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Profile</title>

  <link rel="stylesheet" href="hw.css">

</head>

<body>

  <div class="page">
    <div class="card">

      <div class="left-panel">
        <h1>Student Profile</h1>
        <p>
          Fill out the form and click the buttons to see your JavaScript alerts.
        </p>
      </div>


      <div class="right-panel">

        <p id="output-text">
          Enter your name and favorite color.
        </p>

        <input
          id="name-input"
          type="text"
          placeholder="Type your name"
        >

        <input
          id="color-input"
          type="text"
          placeholder="Type your favorite color"
        >

        <div class="button-row">

          <button onclick="sayHello()">
            Say Hello
          </button>

          <button onclick="showColor()">
            Show Color
          </button>

        </div>

        <p>
          JavaScript Homework Practice
        </p>

      </div>

    </div>
  </div>


  <script src="hw.js"></script>

</body>
</html>
