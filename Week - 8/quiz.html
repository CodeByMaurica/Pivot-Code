<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <section>

        <div class="quiz-results">
            <h1>Online Quiz</h1>
            <h2>Score: 1</h2>
            <h4>You got 2 out of 5</h4>
        </div>
        <!-- Card 1 -->
        <div class="card">

            <h3>Question 1</h3>
            <p>What tags creates a heading?</p>

            <div class="options">
                <label for="q1-1">
                    <input id="q1-1" type="radio" name="q1">2
                </label><br>

                <label>
                    <input type="radio" name="q1">4
                </label><br>

                <label>
                    <input type="radio" name="q1">6
                </label>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card">

            <h3>Question 2</h3>
            <p>What is 2 + 2?</p>

            <div class="options">
                <label for="q2-1">
                    <input id="q2-1" type="radio" name="q2">2
                </label><br>

                <label>
                    <input type="radio" name="q2">4
                </label><br>

                <label>
                    <input type="radio" name="q2">6
                </label>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card">

            <h3>Question 3</h3>
            <p>what color is an apple?</p>

            <div class="options">
                <label for="q3-1">
                    <input id="q3-1" type="radio" name="q3">pink
                </label><br>

                <label>
                    <input type="radio" name="q3">blue
                </label><br>

                <label>
                    <input type="radio" name="q3">red
                </label>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="card">

            <h3>Question 4</h3>
            <p>What is JS?</p>

            <div class="options">
                <label for="q4-1">
                    <input id="q4-1" type="radio" name="q4">a food
                </label><br>

                <label>
                    <input type="radio" name="q4">a coding language
                </label><br>

                <label>
                    <input type="radio" name="q4">a car
                </label>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="card">

            <h3>Question 5</h3>
            <p>What planet am I on?</p>

            <div class="options">
                <label for="q5-1">
                    <input id="q5-1" type="radio" name="q5">Saturn
                </label><br>

                <label>
                    <input type="radio" name="q5">Neptune
                </label><br>

                <label>
                    <input type="radio" name="q5">Earth
                </label>
            </div>
        </div>

<button class="submit-btn">Submit Quiz</button>
    </section>


</body>

</html>
